name: EAS Build iOS

on:
  # Auto-trigger on push to main
  push:
    branches: [main]

  # Manual trigger from GitHub UI (Actions tab > Run workflow)
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        default: "production"
        type: choice
        options:
          - development
          - preview
          - production
      submit:
        description: "Submit to App Store after build?"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS app
        run: eas build --platform ios --profile ${{ inputs.profile || 'production' }} --non-interactive

      - name: Submit to App Store
        if: ${{ inputs.submit == true || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: eas submit --platform ios --profile production --non-interactive

name: EAS Build & Deploy

# ── Triggers ──
# 1. Push to main → OTA update (JS-only, no store review)
# 2. Manual trigger from GitHub Actions UI → full native build + optional submit

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "ios"
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: "Build profile"
        required: true
        default: "production"
        type: choice
        options:
          - development
          - preview
          - production
      submit:
        description: "Submit to stores after build?"
        required: false
        default: false
        type: boolean

# Only one build at a time per branch to avoid version conflicts
concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

# ── OTA Update (push to main) ──
# Ships JS/asset changes instantly — no App Store / Play Store review.
# Only runs on push, not on manual dispatch.

jobs:
  ota-update:
    name: OTA Update
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        run: eas update --branch production --message "${{ github.event.head_commit.message }}" --non-interactive

  # ── Native Build (manual dispatch) ──
  # Builds iOS, Android, or both. Optionally submits to stores.
  # --wait blocks until build finishes on EAS so the submit step has an artifact.

  build-ios:
    name: Build iOS
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'ios')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS app
        run: eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --wait

      - name: Submit to App Store
        if: inputs.submit && inputs.profile == 'production'
        run: eas submit --platform ios --profile production --latest --non-interactive

  build-android:
    name: Build Android
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android app
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --wait

      - name: Submit to Play Store
        if: inputs.submit && inputs.profile == 'production'
        run: eas submit --platform android --profile production --latest --non-interactive
